nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov13n.yaml' will call yolov13.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # Nano
  s: [0.50, 0.50, 1024]   # Small
  m: [0.50, 1.00, 512]   # Small
  l: [1.00, 1.00, 512]    # Large
  x: [1.00, 1.50, 512]    # Extra Large

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_DynamicConv, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DynamicConv, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DynamicConv, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_DynamicConv, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9ss
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]] # 11: HyperACE from P3/P4/P5, outputs P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12: Upsample to P3/8
  - [11, 1, DownsampleConv, []] # 13: DownsampleConv from HyperACE (P4/16->P5/32)
  - [[6, 11], 1, FullPAD_Tunnel, []]  # 14: P4/16 + HyperACE P4/16
  - [[4, 12], 1, FullPAD_Tunnel, []]  # 15: P3/8 + Upsample P3/8
  - [[8, 13], 1, FullPAD_Tunnel, []] # 16: P5/32 + DownsampleConv P5/32
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17: Upsample 16 to P4/16
  - [[-1, 14], 1, Concat, [1]] # 18: cat head P4
  - [-1, 2, C3k2_DynamicConv, [512, True]] # 19
  - [[-1, 11], 1, FullPAD_Tunnel, []]  # 20: cat with HyperACE output

  - [19, 1, nn.Upsample, [None, 2, "nearest"]] # 21: Upsample to P3/8
  - [[-1, 15], 1, Concat, [1]] # 22: cat head P3
  - [-1, 2, C3k2_DynamicConv, [256, True]] # 23
  - [12, 1, Conv, [256, 1, 1]] # 24: adjust Upsample output channels
  - [[23, 24], 1, FullPAD_Tunnel, []]  # 25: P3/8 features
  
  - [-1, 1, Conv, [256, 3, 2]] # 26: Downsample to P4/16
  - [[-1, 20], 1, Concat, [1]] # 27: cat head P4
  - [-1, 2, C3k2_DynamicConv, [512, True]] # 28
  - [[-1, 11], 1, FullPAD_Tunnel, []]  # 29
  
  - [28, 1, Conv, [512, 3, 2]] # 30: Downsample to P5/32
  - [[-1, 16], 1, Concat, [1]] # 31: cat head P5
  - [-1, 2, C3k2_DynamicConv, [1024,True]] # 32 (P5/32-large)
  - [[-1, 13], 1, FullPAD_Tunnel, []]  # 33
  
  - [[25, 29, 33], 1, Detect, [nc]] # Detect(P3, P4, P5)
